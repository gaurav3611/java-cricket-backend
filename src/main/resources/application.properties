spring.application.name=swinglab-api

# Optional .env file in the start directory with KEY=VALUE lines, like backend/.env for the Flask app.
# Real environment variables win over values in this file.
spring.config.import=optional:file:.env[.properties]

# The Flask app is documented on port 5050, so the port stays the same.
server.port=${PORT:5050}

# JSON keys are snake_case, as in the Flask API.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Firebase credentials. The JSON string wins over the file path.
# With neither present the API starts in demo mode: no auth, no Firestore.
swinglab.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
swinglab.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:serviceAccountKey.json}

# Optional static frontend, served at / the way the Flask app served it.
# The default finds the frontend when the Cricket repository is cloned next to this one.
# A folder that does not exist is fine: the API works and / leads to the API reference page.
# A relative path is resolved from the directory the API is started from.
swinglab.frontend-dir=${FRONTEND_DIR:../Cricket/frontend}

# Static files come from the frontend folder first, then from this project's own pages in
# src/main/resources/static: the API reference at /docs, and a fallback index.html that
# sends / to /docs when no frontend provides its own index.html.
spring.web.resources.static-locations=file:${swinglab.frontend-dir}/,classpath:/static/
